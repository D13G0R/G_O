# Secretos locales: DB_PASSWORD, JWT_SECRET y CORS_ALLOWED_ORIGINS.
spring.config.import=optional:file:.env[.properties]

# Postgres config (use by activating 'postgres' profile)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/general_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - disable automatic DDL to avoid modifying n8n DB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SECURITY
app.security.jwt-secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# PAYMENT EVIDENCE STORAGE
app.storage.evidence-dir=${EVIDENCE_DIR:./uploads/evidence}

# TECHNICIAN PHOTO STORAGE
app.storage.technician-photo-dir=${TECHNICIAN_PHOTO_DIR:./uploads/technician-photo}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# LOGGING
logging.level.root=INFO
#colores
spring.output.ansi.enabled=always
# [%thread] -> ese es el hilo pero como no lo uso lo quité
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%5p) %clr(%-30.30logger{29}){magenta} : %clr(%msg%n){bright_white, bold}



