# Postgres config (use by activating 'postgres' profile)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/general_db
spring.datasource.username=postgres
spring.datasource.password=administrador
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - disable automatic DDL to avoid modifying n8n DB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# LOGGING
logging.level.root=INFO
#colores
spring.output.ansi.enabled=always
# [%thread] -> ese es el hilo pero como no lo uso lo quité
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%5p) %clr(%-30.30logger{29}){magenta} : %clr(%msg%n){bright_white, bold}



