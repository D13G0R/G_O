# Postgres config (use by activating 'postgres' profile)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/general_db
spring.datasource.username=postgres
spring.datasource.password=administrador
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - disable automatic DDL to avoid modifying n8n DB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

