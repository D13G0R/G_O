# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:

# `depends_on` starts PostgreSQL before the API. The `db-data` volume persists
# database data between container restarts. The database password comes from
# `DOCKER_DB_PASSWORD` (see `.env.example`) and must match the existing volume.

  server:
    profiles: ["app"]
    build: .
    container_name: GO-API
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/GO_DB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DOCKER_DB_PASSWORD:?Define DOCKER_DB_PASSWORD en el entorno}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el entorno}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence-data:/data/evidence

  db:
    ports:
    - "5433:5432"

    container_name: GO-DB
    image: postgres:latest
    restart: always

    volumes:
      - db-data:/var/lib/postgresql

    environment:
      POSTGRES_DB: GO_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Define DOCKER_DB_PASSWORD en el entorno}

    #expose:
    #  - 5432
      
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
   db-data:
   evidence-data:

